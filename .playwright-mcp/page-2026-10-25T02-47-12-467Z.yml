      - generic [ref=f4e55]:
        - generic [ref=f4e56]:
          - generic [ref=f4e57]: 01 / The concept
          - heading "From AI demos to dependable systems." [level=2] [ref=f4e58]
        - generic [ref=f4e59]:
          - paragraph [ref=f4e61]: A model can reason or generate content. An agent can use that capability to pursue a goal through a sequence of actions. An agentic system connects agents to the tools, data, controls and operational infrastructure required to do useful work.
          - generic [ref=f4e62]:
            - paragraph [ref=f4e63]: The distinction matters. A compelling demonstration is not the same thing as a reliable production system.
            - paragraph [ref=f4e64]: Reliability depends on architecture, access control, evaluation, observability, and the ability to recover when something goes wrong.
        - blockquote [ref=f4e65]: The question is not only what AI can generate. It is what we can reliably build, govern, and operate with it.
    - region [ref=f4e66]:
      - generic [ref=f4e67]:
        - generic [ref=f4e68]:
          - generic [ref=f4e69]: 02 / The architecture
          - heading "Six layers. One operating system for action." [level=2] [ref=f4e70]
          - paragraph [ref=f4e71]: There is no single universal agent stack. These six layers are a practical mental model for connecting intelligence to real work without losing control of security, cost or quality.
        - list [ref=f4e72]:
          - listitem [ref=f4e73]:
            - generic [ref=f4e74]: LAYER 01
            - generic [ref=f4e75]:
              - heading "Intelligence and models" [level=3] [ref=f4e76]
              - paragraph [ref=f4e77]: Choose models on capability, latency, cost, context needs and task risk. Combine language and multimodal models where each one earns its place.
              - generic [ref=f4e78]: Model routing · Inference
          - listitem [ref=f4e79]:
            - generic [ref=f4e80]: LAYER 02
            - generic [ref=f4e81]:
              - heading "Agents and orchestration" [level=3] [ref=f4e82]
              - paragraph [ref=f4e83]: Manage task planning, delegation, state transitions, retries, timeouts and workflows. Use multi-agent patterns only when they improve the outcome.
              - generic [ref=f4e84]: Planning · Workflow state
          - listitem [ref=f4e85]:
            - generic [ref=f4e86]: LAYER 03
            - generic [ref=f4e87]:
              - heading "Tools and connectivity" [level=3] [ref=f4e88]
              - paragraph [ref=f4e89]: Connect agents to APIs, databases, business applications and approved external services. Define tool contracts, then validate every input and output.
              - generic [ref=f4e90]: APIs · MCP
          - listitem [ref=f4e91]:
            - generic [ref=f4e92]: LAYER 04
            - generic [ref=f4e93]:
              - heading "Context, data and memory" [level=3] [ref=f4e94]
              - paragraph [ref=f4e95]: Supply relevant information through retrieval, structured data and controlled state. Apply data lineage, retention rules and access-aware retrieval.
              - generic [ref=f4e96]: RAG · State
          - listitem [ref=f4e97]:
            - generic [ref=f4e98]: LAYER 05
            - generic [ref=f4e99]:
              - heading "Identity, security and governance" [level=3] [ref=f4e100]
              - paragraph [ref=f4e101]: Apply least-privilege permissions, secrets management, policy checks, audit logs, approval gates and isolation between users and tenants.
              - generic [ref=f4e102]: Policy · Human approval
          - listitem [ref=f4e103]:
            - generic [ref=f4e104]: LAYER 06
            - generic [ref=f4e105]:
              - heading "Evaluation and observability" [level=3] [ref=f4e106]
              - paragraph [ref=f4e107]: Trace actions, measure task success, test for regressions, monitor cost and latency, detect unsafe behavior, and design for graceful failure.
              - generic [ref=f4e108]: Tracing · Evaluation
    - region [ref=f4e109]:
      - generic [ref=f4e110]:
        - generic [ref=f4e111]:
          - generic [ref=f4e112]: 03 / Enterprise implications
          - heading "Connect intelligence to the work itself." [level=2] [ref=f4e113]
          - paragraph [ref=f4e114]: Take a workflow that gathers information from approved sources, analyzes it, updates a system of record and prepares a report for human review. The model is one component. The outcome depends on the whole system.
        - generic [ref=f4e115]:
          - generic [ref=f4e116]:
            - term [ref=f4e117]: The opportunity
            - definition [ref=f4e118]:
              - heading "Move beyond isolated copilots" [level=3] [ref=f4e119]
              - paragraph [ref=f4e120]: Connect AI to defined business processes so it can assist with multi-step work, while keeping clear boundaries around sensitive actions and decisions.
          - generic [ref=f4e121]:
            - term [ref=f4e122]: The engineering challenge
            - definition [ref=f4e123]:
              - heading "Make actions inspectable and reversible" [level=3] [ref=f4e124]
              - paragraph [ref=f4e125]: Validate inputs, constrain permissions, log decisions and tool calls, test failure paths, and require human approval where risk warrants it.
          - generic [ref=f4e126]:
            - term [ref=f4e127]: The business test
            - definition [ref=f4e128]:
              - heading "Measure outcomes, not activity" [level=3] [ref=f4e129]
              - paragraph [ref=f4e130]: Track task completion, error rates, cycle time, cost per successful outcome, user acceptance and how often a person has to step in.
          - generic [ref=f4e131]:
            - term [ref=f4e132]: The design principle
            - definition [ref=f4e133]:
              - heading "Use autonomy deliberately" [level=3] [ref=f4e134]
              - paragraph [ref=f4e135]: Start with narrow tasks and explicit limits. Expand autonomy only when evaluation evidence, operating controls and business value justify it.
    - region [ref=f4e136]:
