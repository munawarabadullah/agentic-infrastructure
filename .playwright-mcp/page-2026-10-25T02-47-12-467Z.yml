          - generic [ref=f4e153]: Now
          - generic [ref=f4e154]:
            - heading "From code generation to system design" [level=3] [ref=f4e155]
            - paragraph [ref=f4e156]: AI coding assistants and natural-language development tools are accelerating software creation. The next challenge is not generating code but integrating components, validating behavior, managing permissions and operating systems responsibly.
        - generic [ref=f4e157]:
          - generic [ref=f4e158]: Next
          - generic [ref=f4e159]:
            - heading "Intelligent systems that take action" [level=3] [ref=f4e160]
            - paragraph [ref=f4e161]: As agents become more capable, architecture and governance matter more. The opportunity is to convert business intent into useful actions with measurable controls and outcomes.
