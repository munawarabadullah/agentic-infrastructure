        - generic [ref=f4e138]:
          - generic [ref=f4e139]: 04 / A documented prediction
          - heading "The democratization of software development." [level=2] [ref=f4e140]
          - paragraph [ref=f4e141]: In a Quora answer published in 2018, I argued that basic software development would become more accessible as development platforms improved. I also separated that shift from the enduring value of deep engineering skill and domain expertise.
        - blockquote [ref=f4e142]: As building software becomes easier, the advantage shifts toward knowing what to build, how systems should work, and how to make them secure, reliable and useful.
        - paragraph [ref=f4e143]: A present-day summary of the argument, not a verbatim quotation from the original answer.
        - generic [ref=f4e144]:
          - time [ref=f4e146]: "2018"
          - generic [ref=f4e147]:
            - heading "The original argument" [level=3] [ref=f4e148]
            - paragraph [ref=f4e149]: I wrote that basic development skills would spread while specialized engineering and domain knowledge would keep their value. The answer recommended considering AI or data science as areas of specialization.
            - link "Read the original Quora answer" [ref=f4e150] [cursor=pointer]:
